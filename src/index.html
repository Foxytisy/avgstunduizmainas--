<!DOCTYPE html>
<html>
<head>
    <script src="script.js" type="module"></script>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div class="grid-container">
            <div class="clock" id="widget">
                <div class="clock-face">
                    <div class="minute-hand" id="minute-hand"></div>
                    <div class="hour-hand" id="hour-hand"></div>
                    <div class="second-hand" id="second-hand"></div>
                    <div class="center-point"></div>
                </div>
            </div>
            <div class="calendar" id="widget">
                <div class="calendar-date">
                    <h1 id="date">0</h1>
                    <div>
                        <h1 id="day">-</h1>
                        <h1 id="month">-</h1>
                    </div>
                </div>
                <div class="calendar-names">
                    <div>
                        <h2 id="gray">Vārdadienu svin:</h2>
                        <p id="names">-</p>
                    </div>
                    <div>
                        <h2 id="gray">Dzimšanas dienu svin:</h2>
                        <p id="birthdays">-</p>
                    </div>
                </div>
            </div>
            <div class="quotes" id="widget">
                <h2 id="quotes">-</h2>
                <h2 id="author">-</h2>
            </div>
            <div class="sports" id="widget">

            </div>
            <div class="izmainas" id="widget">

            </div>
            <div class="fotoarhivs" id="widget">

            </div>
            <div class="konsultacijas" id="widget">
                <div class="qr-holder">
                    <img src="../assets/digitools.png">
                </div>
                <h1>Konsultācijas</h1>
            </div>
        </div>
    </div>
</body>
</html>
