<!DOCTYPE html>
<html lang="lv">
<head>
    <script src="dashboard.js" type="module"></script>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body class="dashboard">
    <div class="main">
        <div class="dashboard-grid">
            <div class="izmainas" id="widget">
                <div class="panel-header">
                    <h1>Stundu Izmaiņas</h1>
                    <div class="panel-riki">
                        <div class="datums-izvele">
                            <button type="button" class="poga" id="datums-iepr" aria-label="Iepriekšējā diena">‹</button>
                            <button type="button" class="poga datums-poga" id="datums-poga" title="Izvēlēties datumu">
                                <span id="datums-teksts">-</span>
                            </button>
                            <button type="button" class="poga" id="datums-nak" aria-label="Nākamā diena">›</button>
                            <button type="button" class="poga" id="datums-sodien">Šodien</button>
                            <input type="date" id="datums" tabindex="-1" aria-hidden="true">
                        </div>
                        <button type="button" class="poga" id="notirit-izmainas">Notīrīt visas izmaiņas</button>
                    </div>
                </div>
                <div class="atlase-bar" id="atlase-bar-izmainas" hidden>
                    <p class="atlase-info"></p>
                    <button type="button" class="poga sarkana" data-darbiba="mainit">Mainīt atlasītās</button>
                    <button type="button" class="poga" data-darbiba="nonemt">Noņemt izmaiņas</button>
                    <button type="button" class="poga" data-darbiba="notirit">Notīrīt atlasi</button>
                </div>
                <div class="dashboard-table" id="izmainas-grid" data-rezims="izmainas"></div>
                <div class="updated-container">
                    <h2>Statuss: </h2>
                    <h2 id="statuss">…</h2>
                </div>
            </div>

            <div class="pamatplans" id="widget">
                <div class="panel-header">
                    <h1>Stundu saraksts · <span id="pamatplans-diena">-</span></h1>
                    <form class="pievienot" id="klase-forma">
                        <input class="ievade" id="klase-nosaukums" placeholder="Pievienot jaunu klasi.." required>
                        <button type="submit" class="poga">Pievienot klasi</button>
                    </form>
                </div>
                <div class="atlase-bar" id="atlase-bar-pamatplans" hidden>
                    <p class="atlase-info"></p>
                    <button type="button" class="poga sarkana" data-darbiba="mainit">Mainīt atlasītās</button>
                    <button type="button" class="poga" data-darbiba="notirit">Notīrīt atlasi</button>
                </div>
                <div class="dashboard-table" id="pamatplans-grid" data-rezims="pamatplans"></div>
            </div>

            <div class="reklamas" id="widget">
                <div class="panel-header">
                    <h1>Bilžu karuselis</h1>
                    <div class="panel-riki">
                        <label class="periods-label">
                            <h2 id="gray">Mainās ik pēc</h2>
                            <input type="number" class="ievade periods-ievade" id="reklamas-periods" min="3" max="600" step="1">
                            <h2 id="gray">s</h2>
                        </label>
                        <button type="button" class="poga sarkana" id="reklamas-pievienot">Pievienot bildes</button>
                        <input type="file" id="reklamas-fails" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
                    </div>
                </div>
                <p class="karuselis-statuss" id="karuselis-statuss"></p>
                <div class="reklamas-saraksts" id="reklamas-saraksts"></div>
            </div>

            <div class="tema" id="widget">
                <div class="panel-header">
                    <h1>Pārklājums</h1>
                </div>
                <p class="karuselis-statuss" id="tema-statuss"></p>
                <div class="tema-saturs">
                    <div class="tema-iestatijumi">
                        <p class="panel-hint">Caurspīdīgs PNG pāri visam ekrānam. Ieteicamais izmērs 1312 × 752 px (vai 2624 × 1504).</p>
                        <div class="tema-pogas">
                            <button type="button" class="poga sarkana" id="parklajums-pievienot">Pievienot pārklājumu</button>
                            <button type="button" class="poga" id="parklajums-nonemt">Atgriezt sākotnējo</button>
                            <input type="file" id="parklajums-fails" accept="image/png,image/webp,image/gif" hidden>
                        </div>
                        <label class="periods-label">
                            <h2 id="gray">Redzamība</h2>
                            <input type="range" id="parklajums-redzamiba" min="10" max="100" step="5">
                            <span id="parklajums-proc"></span>
                        </label>
                    </div>

                    <div class="tema-prieksskats">
                        <div class="tema-ramis">
                            <iframe id="tema-iframe" src="index.html" title="TV priekšskatījums" tabindex="-1"></iframe>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <dialog id="picker">
        <form method="dialog" class="picker-forma">
            <h1 id="picker-virsraksts">-</h1>
            <p id="picker-info" class="picker-info"></p>

            <input type="search" class="ievade" id="picker-meklet" placeholder="Meklēt stundu…" autocomplete="off">
            <div class="picker-saraksts" id="picker-saraksts"></div>

            <label class="picker-kabinets">
                <h2 id="gray">Kabinets</h2>
                <input class="ievade" id="picker-kabinets" maxlength="20" autocomplete="off">
            </label>

            <details class="picker-jauna">
                <summary>Jauna stunda</summary>
                <div class="pievienot">
                    <input class="ievade" id="jauna-nosaukums" placeholder="Nosaukums" maxlength="80">
                    <input class="ievade kabinets-ievade" id="jauna-kabinets" placeholder="Kab." maxlength="20">
                    <button type="button" class="poga" id="jauna-pievienot">+</button>
                </div>
            </details>

            <div class="picker-pogas">
                <button type="submit" class="poga" value="apply">Apstiprināt</button>
                <button type="submit" class="poga" value="revert" id="picker-nonemt">Noņemt izmaiņu</button>
                <button type="submit" class="poga" value="cancel" formnovalidate>Atcelt</button>
            </div>
        </form>
    </dialog>
</body>
</html>
